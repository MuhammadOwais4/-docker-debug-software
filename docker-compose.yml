version: '3.8'

services:
  backend:
    build: ./server
    container_name: debug-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - CLIENT_ORIGIN=https://naya-naam.vercel.app
    ports:
      - "5000:5000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge