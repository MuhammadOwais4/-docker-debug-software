services:
  mongo:
    image: mongo:7
    container_name: debug-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  backend:
    build: ./server
    container_name: debug-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - CLIENT_ORIGIN=https://docker-debug-software.vercel.app
      - MONGODB_URI=mongodb://mongo:27017/Stock-Management-System
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    networks:
      - app-network

  frontend:
    build: ./client
    container_name: debug-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
