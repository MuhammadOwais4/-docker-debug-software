version: '3.8'

services:
  backend:
    build: ./server
    container_name: debug-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - CLIENT_ORIGIN=http://localhost
    expose:
      - "5000"
    networks:
      - app-network

  frontend:
    build: ./client
    container_name: debug-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
